<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pruebas · StudyFlow</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 820px; margin: 24px auto; padding: 0 16px; color: #1f2d49; }
    h1 { color: #16233f; }
    .pass { color: #2f6b34; } .fail { color: #a32424; font-weight: 700; }
    .case { padding: 4px 0; border-bottom: 1px solid #eef2f9; }
    #summary { font-size: 1.2rem; font-weight: 700; margin: 16px 0; }
    code { background:#eef2f9; padding:1px 5px; border-radius:4px; }
  </style>
</head>
<body>
  <h1>Pruebas de StudyFlow</h1>
  <p>Pruebas de las funciones principales (motor de repaso FSRS y análisis CSV).
     Se ejecutan en el navegador, sin herramientas de build. Abre esta página servida por el mismo servidor local.</p>
  <div id="summary">Ejecutando…</div>
  <div id="results"></div>

  <script type="module">
    import * as sched from './js/domain/scheduler.js';
    import { parseCSV, csvRowsToCards, cardsToCSV, jsonToDeck, deckToJSON } from './js/domain/csv.js';

    const results = document.getElementById('results');
    let passed = 0, failed = 0;

    function check(name, cond) {
      const ok = !!cond;
      ok ? passed++ : failed++;
      const div = document.createElement('div');
      div.className = 'case';
      div.innerHTML = `<span class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'}</span> ${name}`;
      results.appendChild(div);
      if (!ok) console.error('FALLO:', name);
    }

    // ---- Scheduler / FSRS ----
    const now = new Date();
    const s0 = sched.newState(now);
    check('newState crea una tarjeta en estado Nueva (0)', s0.state === 0);
    check('newState vence de inmediato (due <= ahora)', new Date(s0.due).getTime() <= now.getTime() + 1000);
    check('isDue es verdadero para una tarjeta nueva', sched.isDue(s0, now) === true);

    const prev = sched.preview(s0, now);
    const keys = [sched.RATING.AGAIN, sched.RATING.HARD, sched.RATING.GOOD, sched.RATING.EASY];
    check('preview devuelve las 4 calificaciones', keys.every(k => prev[k] && prev[k].due));
    const d = keys.map(k => new Date(prev[k].due).getTime());
    check('intervalos ordenados: Otra vez ≤ Difícil ≤ Bien ≤ Fácil', d[0] <= d[1] && d[1] <= d[2] && d[2] <= d[3]);
    check('cada calificación trae texto de intervalo', keys.every(k => typeof prev[k].intervalText === 'string' && prev[k].intervalText.length));

    const r = sched.applyRating(s0, sched.RATING.GOOD, now);
    check('applyRating devuelve estado y registro', r.state && r.log);
    check('applyRating registra la calificación (Bien = 3)', r.log.rating === sched.RATING.GOOD);
    check('tras un repaso, reps aumenta', r.state.reps >= 1);
    const rEasy = sched.applyRating(s0, sched.RATING.EASY, now);
    check('Fácil programa más lejos que Bien', new Date(rEasy.state.due).getTime() >= new Date(r.state.due).getTime());

    check('humanInterval: 90 s → "ahora"/minutos', /ahora|min/.test(sched.humanInterval(now, new Date(now.getTime() + 90000))));
    check('humanInterval: 3 días', sched.humanInterval(now, new Date(now.getTime() + 3 * 86400000)) === '3 días');

    // ---- CSV ----
    const csv = 'pregunta,respuesta,etiquetas\n"¿2+2?","4","mates; básico"\nHola,"Dice ""hola"""\n';
    const rows = parseCSV(csv);
    check('parseCSV respeta comillas y comas internas', rows.length === 3 && rows[1][2] === 'mates; básico');
    check('parseCSV maneja comillas escapadas', rows[2][1] === 'Dice "hola"');

    const { cards, errors } = csvRowsToCards(rows);
    check('csvRowsToCards detecta el encabezado y crea 2 tarjetas', cards.length === 2);
    check('csvRowsToCards separa etiquetas', cards[0].tags.length === 2 && cards[0].tags[0] === 'mates');

    const bad = csvRowsToCards(parseCSV('pregunta,respuesta\nSoloPregunta,\n'));
    check('csvRowsToCards reporta filas inválidas', bad.errors.length >= 1 && bad.cards.length === 0);

    const out = cardsToCSV([{ front: 'a,b', back: 'c"d', tags: ['x', 'y'] }]);
    check('cardsToCSV entrecomilla campos con comas/comillas', out.includes('"a,b"') && out.includes('"c""d"'));

    // ---- JSON de mazo ----
    const j = deckToJSON({ name: 'M', subject: 'Mate', grade: 1, description: '', shareCode: 'ABC123' },
                         [{ front: 'p', back: 'r', tags: [] }]);
    const back = jsonToDeck(j);
    check('deckToJSON/jsonToDeck conservan el mazo', back.deck.name === 'M' && back.cards.length === 1);
    let threw = false;
    try { jsonToDeck({ foo: 1 }); } catch { threw = true; }
    check('jsonToDeck rechaza un archivo inválido', threw);

    // ---- Resumen ----
    const summary = document.getElementById('summary');
    summary.textContent = `${passed} pasaron · ${failed} fallaron`;
    summary.className = failed ? 'fail' : 'pass';
    console.log(`Pruebas StudyFlow: ${passed} pasaron, ${failed} fallaron`);
  </script>
</body>
</html>
